services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phundz
      POSTGRES_PASSWORD: phundz
      POSTGRES_DB: phundz
    ports:
      - "5432:5432"
    volumes:
      - phundz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phundz -d phundz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  phundz-postgres: