services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phundz
      POSTGRES_PASSWORD: phundz
      POSTGRES_DB: phundz
    ports:
      - "5432:5432"
    volumes:
      - phundz-postgres:/var/lib/postgresql/data
      # Creates the separate phundz_test database used by integration tests.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phundz -d phundz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  phundz-postgres: